name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
